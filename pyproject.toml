[project]
name = "supply-chain-disruption-system"
version = "2.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn==0.29.0",
  "scikit-learn==1.4.2",
  "pandas==2.2.2",
  "python-dotenv==1.0.1",
  "joblib==1.4.2",
  "requests==2.31.0",
  "sqlalchemy==2.0.30",
  "google-generativeai==0.7.2",
  "pydantic==2.7.1",
  "psutil>=5.9",
  "psycopg[binary]>=3.1,<4",
]

[tool.vercel]
entrypoint = "api.main:app"

[tool.vercel.scripts]
build = "python vercel_build.py"
